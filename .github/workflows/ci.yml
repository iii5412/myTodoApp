name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (web + server bundle)
        run: npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build Android assets
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run android:sync
      # Signing every debug APK with the same key lets a new APK install over the old one.
      # The keystore lives only in the DEBUG_KEYSTORE_BASE64 secret (never in the repo);
      # without it (e.g. pull requests from forks) Gradle makes a throwaway key as before.
      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > android/ci-debug.keystore
            # Public certificate fingerprint only; confirms the secret decoded into a usable key.
            keytool -list -v -keystore android/ci-debug.keystore -storepass android | grep -E "Alias name|SHA256"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; the debug APK gets a throwaway signing key."
          fi
      - name: Compile debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon
      - name: Show APK signing certificate
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA-256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: mytodo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
